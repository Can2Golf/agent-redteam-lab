[project]
name = "redteam"
version = "0.1.0"
description = "Red team testing framework for AI agents (Stage 1: deterministic rule-based model)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks tests as requiring live API calls (deselect with '-m \"not live\"')",
]
addopts = "-m 'not live'"
